[package]
name = "civ-atlas-terrain"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Rust port of the pinned Civ Atlas terrain generator"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Shewchuk orientation predicates for the pinned Delaunator port.
robust = "1.2.0"
# Typed invalid-parameter and cancellation failures at the terrain boundary.
thiserror = "2.0.17"
# Root generation recipes persist author controls and fixed evaluator scale.
serde = { version = "1", features = ["derive"] }
